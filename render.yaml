# Render Blueprint: web app + PostgreSQL for SD-SCPF
# Docs: https://render.com/docs/blueprint-spec
# Setup checklist: docs/render.md

databases:
  - name: sd-scpf-db
    plan: free
    databaseName: sd_scpf
    user: sd_scpf

services:
  - type: web
    name: SD-SCPF
    runtime: node
    plan: free
    # Build: schema migrate only + next build (no xlsx import — too heavy for 512MB).
    # Seed once via Shell after DATABASE_URL is set: npm run import
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Cap V8 heap so Next stays under the 512MB instance limit (leave room for native).
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: DATABASE_URL
        fromDatabase:
          name: sd-scpf-db
          property: connectionString
